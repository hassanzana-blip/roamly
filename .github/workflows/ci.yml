name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  MYSQL_ROOT_URL: mysql://root:root@127.0.0.1:3306
  DATABASE_URL: mysql://root:root@127.0.0.1:3306/hellosky_it

jobs:
  test:
    name: Typecheck · lint · unit · integration · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hellosky_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Integration tests (MySQL)
        run: npm run test:it
        env:
          IT_ROOT_DATABASE_URL: ${{ env.MYSQL_ROOT_URL }}
          IT_DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Build (Vite + esbuild)
        run: npm run build
      - name: Migrations are consistent (drizzle-kit check)
        run: npx drizzle-kit check
      - name: Schema has no un-migrated changes
        run: npm run migrate:check
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: E2E (Playwright, demo mode)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hellosky_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Migrate test database
        run: node scripts/migrate.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hellosky:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image starts and answers /healthz
        run: |
          docker run -d --name web -p 3000:3000 \
            -e SKIP_ENV_SAFETY=true -e APP_ENV=development -e DATABASE_URL=mysql://x:x@127.0.0.1:3306/x \
            -e PII_ENCRYPTION_KEY=$(openssl rand -base64 32) hellosky:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/healthz && break || sleep 1; done
          curl -fsS http://localhost:3000/healthz
          docker logs web
          docker rm -f web
