<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#CDF527" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Personvernvennlig analyse (Plausible): ingen informasjonskapsler, ingen
         persondata, ingen sporing på tvers av nettsteder. CSP åpner kun for
         plausible.io i script-src og connect-src (api/boot.ts). -->
    <script async src="https://plausible.io/js/pa--KAx43tEw4caqzQ7AsePa.js"></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        };
      plausible.init =
        plausible.init ||
        function (i) {
          plausible.o = i || {};
        };
      plausible.init();
    </script>
    <script>
      // Tidlig tema- og språkinit — unngår blinking ved last
      try {
        if (localStorage.getItem("hellosky:theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
        var l = localStorage.getItem("hellosky:lang");
        if (l && /^(nb|en|sv|da|de)$/.test(l)) document.documentElement.lang = l;
      } catch (e) {}
    </script>
    <!-- Standard-metadata for forsiden. Sidene overstyrer ved kjøretid via usePageMeta (src/lib/seo.ts). -->
    <meta
      name="description"
      content="HelloSky — flybilletter fra Norge til hele verden. Søk i hele markedet, se totalprisen med en gang og få personlig hjelp fra norsk kundeservice."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://hellosky.no/" />
    <link rel="alternate" hreflang="nb" href="https://hellosky.no/" />
    <link rel="alternate" hreflang="x-default" href="https://hellosky.no/" />
    <title>Flybilletter fra Norge til hele verden | HelloSky</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HelloSky" />
    <meta property="og:title" content="Flybilletter fra Norge til hele verden | HelloSky" />
    <meta
      property="og:description"
      content="Søk i hele markedet, se totalprisen med en gang og få hjelp av ekte mennesker hele veien. Norsk kundeservice alle dager 06–24."
    />
    <meta property="og:locale" content="nb_NO" />
    <meta property="og:url" content="https://hellosky.no/" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "HelloSky",
        "url": "https://hellosky.no",
        "description": "Norsk flybestillingstjeneste — søk, bestilling og kundeservice på norsk.",
        "areaServed": "NO",
        "telephone": "+47 22 41 00 00",
        "email": "hei@hellosky.no",
        "openingHours": "Mo-Su 06:00-24:00"
      }
    </script>
    <!-- Fonts: Manrope (UI, matches the rounded grotesk wordmark) + Newsreader (editorial headlines). Only hosts actually used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
