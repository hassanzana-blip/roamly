<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123B46" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS bruker ikke SVG til hjemskjermikonet; uten en PNG her får appen et
         tomt felt når noen legger HelloSky på hjemskjermen. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Personvernvennlig analyse (Plausible): ingen informasjonskapsler, ingen
         persondata, ingen sporing på tvers av nettsteder. CSP åpner kun for
         plausible.io i script-src og connect-src (api/boot.ts). -->
    <script async src="https://plausible.io/js/pa--KAx43tEw4caqzQ7AsePa.js"></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        };
      plausible.init =
        plausible.init ||
        function (i) {
          plausible.o = i || {};
        };
      plausible.init();
    </script>
    <!-- Travelpayouts Drive (affiliate-monetisering av utgående reiselenker).
         Lastes én gang fra appskallet, aldri fra en React-komponent. Skriptet er
         uendret fra Travelpayouts bortsett fra sperren mot /admin: adminen skal
         ikke ha tredjepartsskript som skriver om lenker. CSP åpner for
         emrldco.com i script-src og connect-src (api/boot.ts). -->
    <script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1" data-cmp-ab="2">
      (function () {
          if (location.pathname === "/admin" || location.pathname.indexOf("/admin/") === 0) return;
          var script = document.createElement("script");
          script.async = 1;
          script.setAttribute("data-cmp-ab","2");
          script.src = 'https://emrldco.com/NTc1NTQ5.js?t=575549';
          document.head.appendChild(script);
      })();
    </script>
    <script>
      // Tidlig tema- og språkinit — unngår blinking ved last
      try {
        if (localStorage.getItem("hellosky:theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
        var l = localStorage.getItem("hellosky:lang");
        if (l && /^(nb|en|sv|da|de)$/.test(l)) document.documentElement.lang = l;
      } catch (e) {}
    </script>
    <!--
      Per-rute metadata. Serveren (api/lib/seoHead.ts) bytter ut alt mellom
      seo:start og seo:end med tittel, description, canonical og og:* for den
      faktiske stien, før HTML-en sendes. Taggene under er forsidens verdier og
      gjelder kun i dev-serveren og hvis injeksjonen skulle feile.

      data-hs-seo merker taggene serveren eier. Klienten fjerner dem når den
      setter sine egne (src/providers/helmet.tsx), slik at dokumentet aldri har
      to canonical-er samtidig.

      IKKE legg sidespesifikke tagger utenfor markørene: de blir liggende igjen
      på alle ruter, og en ekstra <link rel="canonical"> til forsiden er nok til
      at ingen underside kan indekseres.
    -->
    <!--seo:start-->
    <title data-hs-seo="true">Søk og sammenlign fly, hotell og leiebil | HelloSky</title>
    <meta
      data-hs-seo="true"
      name="description"
      content="HelloSky er en søkemotor for reiser: priser fra flyselskaper, hoteller og reisebyråer i ett søk. Bestillingen fullføres alltid hos leverandøren."
    />
    <meta data-hs-seo="true" name="robots" content="index,follow" />
    <link data-hs-seo="true" rel="canonical" href="https://hellosky.no/" />
    <link rel="alternate" hreflang="nb" href="https://hellosky.no/" />
    <link rel="alternate" hreflang="x-default" href="https://hellosky.no/" />
    <meta data-hs-seo="true" property="og:type" content="website" />
    <meta property="og:site_name" content="HelloSky" />
    <meta property="og:locale" content="nb_NO" />
    <meta data-hs-seo="true" property="og:title" content="Søk og sammenlign fly, hotell og leiebil | HelloSky" />
    <meta
      data-hs-seo="true"
      property="og:description"
      content="HelloSky er en søkemotor for reiser: priser fra flyselskaper, hoteller og reisebyråer i ett søk. Bestillingen fullføres alltid hos leverandøren."
    />
    <meta data-hs-seo="true" property="og:url" content="https://hellosky.no/" />
    <meta data-hs-seo="true" property="og:image" content="https://hellosky.no/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta data-hs-seo="true" name="twitter:title" content="Søk og sammenlign fly, hotell og leiebil | HelloSky" />
    <meta
      data-hs-seo="true"
      name="twitter:description"
      content="HelloSky er en søkemotor for reiser: priser fra flyselskaper, hoteller og reisebyråer i ett søk. Bestillingen fullføres alltid hos leverandøren."
    />
    <meta data-hs-seo="true" name="twitter:image" content="https://hellosky.no/og.png" />
    <!--seo:end-->
    <!-- Nettstedsomfattende organisasjonsmarkering. Finnes kun her; forsiden
         skal ikke legge inn en ekstra kopi via usePageMeta. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "HelloSky",
        "url": "https://hellosky.no",
        "description": "Norsk flybestillingstjeneste — søk, bestilling og kundeservice på norsk.",
        "areaServed": "NO",
        "telephone": "+47 22 41 00 00",
        "email": "hei@hellosky.no",
        "openingHours": "Mo-Su 06:00-24:00"
      }
    </script>
    <!-- Fonts are self-hosted (@fontsource-variable) and bundled by Vite: no third-party font requests. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
